  <script>
    const textes = {"fr":{"titre":"Une invitation BookHunter","texte":"Un ami t’invite sur BookHunter : vous voyez vos étagères, vous vous prêtez des livres et vous lisez ensemble.","etapes":"Installe BookHunter, puis touche à nouveau le lien reçu : l’appli s’ouvre sur l’invitation.","installer":"Installer BookHunter","copier":"Copier le lien","copie":"Lien copié","validite":"Le lien vaut 24 h, pour une seule personne. Il ne passe jamais par nos serveurs depuis cette page."},"en":{"titre":"A BookHunter invitation","texte":"A friend is inviting you to BookHunter: you see each other's shelves, lend each other books and read together.","etapes":"Install BookHunter, then tap the link you received again: the app opens on the invitation.","installer":"Install BookHunter","copier":"Copy the link","copie":"Link copied","validite":"The link is valid for 24 hours, for one person only. From this page, it never goes through our servers."},"de":{"titre":"Eine Einladung zu BookHunter","texte":"Ein Freund lädt dich zu BookHunter ein: Ihr seht eure Regale, leiht euch Bücher und lest zusammen.","etapes":"Installiere BookHunter und tippe dann erneut auf den erhaltenen Link: Die App öffnet sich bei der Einladung.","installer":"BookHunter installieren","copier":"Link kopieren","copie":"Link kopiert","validite":"Der Link gilt 24 Stunden und nur für eine Person. Von dieser Seite aus läuft er nie über unsere Server."},"es":{"titre":"Una invitación a BookHunter","texte":"Un amigo te invita a BookHunter: veis vuestras estanterías, os prestáis libros y leéis juntos.","etapes":"Instala BookHunter y vuelve a tocar el enlace que recibiste: la aplicación se abre en la invitación.","installer":"Instalar BookHunter","copier":"Copiar el enlace","copie":"Enlace copiado","validite":"El enlace vale 24 horas, para una sola persona. Desde esta página, nunca pasa por nuestros servidores."},"it":{"titre":"Un invito a BookHunter","texte":"Un amico ti invita su BookHunter: vedete i vostri scaffali, vi prest
