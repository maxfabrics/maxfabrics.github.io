  <script>
    const textes = {"fr":{"titre":"Une invitation PlateHunter","texte":"Un proche t’invite à rejoindre ses Hunters : vous notez vos restos ensemble.","etapes":"Installe PlateHunter, puis touche à nouveau le lien reçu : l’appli s’ouvre sur l’invitation.","installer":"Installer PlateHunter","copier":"Copier le lien","copie":"Lien copié","validite":"Le lien vaut 24 h, pour une seule personne. Il ne passe jamais par nos serveurs depuis cette page."},"en":{"titre":"A PlateHunter invitation","texte":"Someone close invites you to join their Hunters: you rate your restaurants together.","etapes":"Install PlateHunter, then tap the link you received again: the app opens on the invitation.","installer":"Install PlateHunter","copier":"Copy the link","copie":"Link copied","validite":"The link is valid for 24 hours, for one person only. From this page, it never goes through our servers."},"de":{"titre":"Eine PlateHunter-Einladung","texte":"Jemand, der dir nahesteht, lädt dich zu seinen Huntern ein: Ihr bewertet eure Restaurants gemeinsam.","etapes":"Installiere PlateHunter und tippe dann noch einmal auf den erhaltenen Link: Die App öffnet sich mit der Einladung.","installer":"PlateHunter installieren","copier":"Link kopieren","copie":"Link kopiert","validite":"Der Link gilt 24 Stunden, für eine einzige Person. Von dieser Seite aus läuft er nie über unsere Server."},"es":{"titre":"Una invitación de PlateHunter","texte":"Alguien cercano te invita a unirte a sus Hunters: valoráis vuestros restaurantes juntos.","etapes":"Instala PlateHunter y vuelve a tocar el enlace recibido: la app se abre en la invitación.","installer":"Instalar PlateHunter","copier":"Copiar el enlace","copie":"Enlace copiado","validite":"El enlace vale 24 horas, para una sola persona. Desde esta página, nunca pasa por nuestros servidores."},"it":{"titre":"Un invito PlateHunter","texte":"Una persona cara ti invita tra i suoi Hunter: valutate insieme i vostri ristoranti.","etapes":"Installa PlateHunter, poi tocca di nuovo il link ricevuto: l’app si apre sull’invito.","installer":"Installa PlateHunter","copier":"Copia il link","copie":"Link copiato","validite":"Il link vale 24 ore, per una sola persona. Da questa pagina, non passa mai dai nostri server."},"pt":{"titre":"Um convite PlateHunter","texte":"Alguém próximo convida-te a juntar-te aos seus Hunters: avaliam juntos os vossos restaurantes.","etapes":"Instala a PlateHunter e toca outra vez na ligação recebida: a app abre-se no convite.","installer":"Instalar a PlateHunter","copier":"Copiar a ligação","copie":"Ligação copiada","validite":"A ligação é válida durante 24 horas, para uma única pessoa. A partir desta página, nunca passa pelos nossos servidores."}};

      try {
        await navigator.clipboard.writeText(location.href);
        document.getElementById('statut').textContent = t.copie;
      } catch (_) {}
    });
